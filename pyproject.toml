# Project setup file.
# Lists the package name, version, and what libraries this project needs to run.

[project]
name = "meg-bdh"
version = "0.1.0"
description = "MEG decoding with a stripped BDH model on LibriBrain"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
