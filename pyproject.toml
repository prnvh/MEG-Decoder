[project]
name = "meg-bdh"
version = "0.1.0"
description = "MEG decoding with a stripped BDH model on LibriBrain"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "numpy",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
